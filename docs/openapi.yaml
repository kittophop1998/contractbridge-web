openapi: 3.1.0
info:
  title: ContractBridge Backend API
  version: 1.0.0
  description: REST contract for the ContractBridge web application. All resources are isolated by project.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /projects:
    get:
      summary: List projects
      description: Returns all projects ordered by most recently updated. apiCount is computed from APIs belonging to each project.
      operationId: listProjects
      responses:
        '200':
          description: Projects returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
              example:
                - id: prj_farknoi
                  name: farknoi-api
                  description: Mobile application API.
                  version: 1.0.0
                  baseUrl: https://api.farknoi.com/api/v1
                  securitySchemes: []
                  schemas: []
                  apiCount: 4
                  createdAt: '2026-01-12T03:20:00.000Z'
                  updatedAt: '2026-08-28T09:05:00.000Z'
    post:
      summary: Create project
      description: Creates an isolated API-contract project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
            example:
              name: billing-api
              description: Billing and invoice contract.
              version: 1.0.0
              baseUrl: https://api.example.com/api/v1
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get project
      description: Returns one project, including shared schemas and security schemes.
      operationId: getProject
      responses:
        '200':
          description: Project returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    patch:
      summary: Update project
      description: Updates supplied project fields. apiCount, id and timestamps are read-only.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
            example:
              description: Updated billing contract.
              version: 1.1.0
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    delete:
      summary: Delete project
      description: Deletes the project and all API definitions owned by it.
      operationId: deleteProject
      responses:
        '204': { description: Project deleted; no response body. }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /projects/{projectId}/apis:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project APIs
      description: Returns only endpoints belonging to projectId.
      operationId: listApis
      responses:
        '200':
          description: API definitions returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiEndpoint' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Create API definition
      description: Creates an endpoint inside projectId. The server assigns id, projectId and timestamps.
      operationId: createApi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiEndpointInput' }
            example:
              method: GET
              path: /api/v1/users/{id}
              operationId: getUserById
              summary: Get a user
              description: Returns a user by id.
              tags: [Users]
              security: [bearerAuth]
              parameters: []
              responses:
                - id: res_200
                  status: 200
                  description: Successful response.
      responses:
        '201':
          description: API definition created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEndpoint' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /projects/{projectId}/apis/{apiId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ApiId'
    get:
      summary: Get API definition
      description: Returns one endpoint only when it belongs to projectId.
      operationId: getApi
      responses:
        '200':
          description: API definition returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEndpoint' }
        '404': { $ref: '#/components/responses/ApiNotFound' }
    put:
      summary: Replace API definition
      description: Replaces all editable endpoint fields. id, projectId and timestamps are retained by the server.
      operationId: updateApi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiEndpointInput' }
      responses:
        '200':
          description: Updated API definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEndpoint' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ApiNotFound' }
    delete:
      summary: Delete API definition
      description: Deletes only apiId from projectId; it cannot affect another project.
      operationId: deleteApi
      responses:
        '204': { description: API definition deleted; no response body. }
        '404': { $ref: '#/components/responses/ApiNotFound' }
  /projects/{projectId}/exports/openapi:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Generate OpenAPI export
      description: Generates an OpenAPI 3.1 YAML file from the project's current API definitions, schemas, security and examples.
      operationId: exportOpenApi
      responses:
        '200':
          description: Generated export file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
              example:
                format: openapi
                filename: openapi.yaml
                language: yaml
                content: "openapi: 3.1.0\ninfo:\n  title: farknoi-api API\n"
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /projects/{projectId}/exports/api-spec:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Generate Markdown API specification
      description: Generates a readable Markdown API contract from the project's current data.
      operationId: exportApiSpec
      responses:
        '200':
          description: Generated export file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
              example:
                format: api-spec
                filename: api-spec.md
                language: markdown
                content: "# farknoi-api API Specification\n"
        '404': { $ref: '#/components/responses/ProjectNotFound' }
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: ContractBridge project identifier.
      schema: { type: string }
      example: prj_farknoi
    ApiId:
      name: apiId
      in: path
      required: true
      description: API definition identifier belonging to projectId.
      schema: { type: string }
      example: api_farknoi_list_users
  responses:
    ValidationError:
      description: Request data is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: VALIDATION_ERROR, message: name is required } }
    ProjectNotFound:
      description: The project does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: PROJECT_NOT_FOUND, message: Project not found } }
    ApiNotFound:
      description: The API does not exist or does not belong to the project.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: API_NOT_FOUND, message: API endpoint not found } }
  schemas:
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectInput'
        - type: object
          required: [id, apiCount, createdAt, updatedAt]
          properties:
            id: { type: string, example: prj_farknoi }
            apiCount: { type: integer, minimum: 0, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }
    ProjectInput:
      type: object
      required: [name, description, version, baseUrl]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        version: { type: string, example: 1.0.0 }
        baseUrl: { type: string, format: uri, example: https://api.example.com/api/v1 }
        securitySchemes:
          type: array
          items: { $ref: '#/components/schemas/SecurityScheme' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/NamedSchema' }
    ProjectPatch:
      type: object
      description: Every ProjectInput field is optional for PATCH.
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        version: { type: string, example: 1.0.0 }
        baseUrl: { type: string, format: uri, example: https://api.example.com/api/v1 }
        securitySchemes:
          type: array
          items: { $ref: '#/components/schemas/SecurityScheme' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/NamedSchema' }
    SecurityScheme:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: bearerAuth }
        type: { type: string, enum: [http, apiKey] }
        description: { type: string }
        scheme: { type: string, enum: [bearer, basic] }
        bearerFormat: { type: string, example: JWT }
        in: { type: string, enum: [header, query] }
        paramName: { type: string, example: X-API-Key }
    NamedSchema:
      type: object
      required: [name, schema]
      properties:
        name: { type: string, example: User }
        description: { type: string }
        schema: { $ref: '#/components/schemas/ApiSchema' }
    ApiEndpoint:
      allOf:
        - $ref: '#/components/schemas/ApiEndpointInput'
        - type: object
          required: [id, projectId, createdAt, updatedAt]
          properties:
            id: { type: string }
            projectId: { type: string }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }
    ApiEndpointInput:
      type: object
      required: [method, path, operationId, summary, tags, security, parameters, responses]
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS] }
        path: { type: string, pattern: '^/', example: '/api/v1/users/{id}' }
        operationId: { type: string, example: getUserById }
        summary: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        security: { type: array, items: { type: string }, description: Project security-scheme names; empty means public. }
        parameters: { type: array, items: { $ref: '#/components/schemas/ApiParameter' } }
        requestBody: { $ref: '#/components/schemas/ApiRequestBody' }
        responses: { type: array, items: { $ref: '#/components/schemas/ApiResponse' } }
    ApiParameter:
      type: object
      required: [id, name, in, required, schema]
      properties:
        id: { type: string }
        name: { type: string }
        in: { type: string, enum: [path, query, header] }
        required: { type: boolean, description: Path parameters must be true. }
        description: { type: string }
        schema: { $ref: '#/components/schemas/ApiSchema' }
        example: { type: string, description: JSON text when possible; otherwise plain text. }
    ApiRequestBody:
      type: object
      required: [required, contentType, schema]
      properties:
        description: { type: string }
        required: { type: boolean }
        contentType: { type: string, example: application/json }
        schema: { $ref: '#/components/schemas/ApiSchema' }
        example: { type: string }
    ApiResponse:
      type: object
      required: [id, status, description]
      properties:
        id: { type: string }
        status: { type: integer, minimum: 100, maximum: 599, example: 200 }
        description: { type: string }
        contentType: { type: string, example: application/json }
        schema: { $ref: '#/components/schemas/ApiSchema' }
        example: { type: string }
    ApiSchema:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [string, number, integer, boolean, object, array] }
        format: { type: string, example: uuid }
        nullable: { type: boolean }
        description: { type: string }
        enum: { type: array, items: { type: string } }
        ref: { type: string, description: Name of a Project.schemas entry. }
        properties: { type: array, items: { $ref: '#/components/schemas/ApiSchemaProperty' } }
        items: { $ref: '#/components/schemas/ApiSchema' }
    ApiSchemaProperty:
      allOf:
        - $ref: '#/components/schemas/ApiSchema'
        - type: object
          required: [name, required]
          properties:
            name: { type: string }
            required: { type: boolean }
    ExportFile:
      type: object
      required: [format, filename, language, content]
      properties:
        format: { type: string, enum: [openapi, api-spec] }
        filename: { type: string, enum: [openapi.yaml, api-spec.md] }
        language: { type: string, enum: [yaml, markdown] }
        content: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: PROJECT_NOT_FOUND }
            message: { type: string, example: Project not found }
